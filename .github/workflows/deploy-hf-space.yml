# Deploys the backend to a Hugging Face Docker Space on every push to main.
# Setup (once): repository secret HF_TOKEN (a Hugging Face token with write access) and
# repository variable HF_SPACE (e.g. NambertJones/validex-api). Skipped until both exist.
name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", "sample_docs/lab_photos/**", "deploy/hf-space/**", ".github/workflows/deploy-hf-space.yml"]
  workflow_dispatch:

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          lfs: true

      - name: Build Space contents
        if: steps.cfg.outputs.skip != 'true'
        run: bash deploy/hf-space/build_context.sh "$RUNNER_TEMP/space"

      - name: Push to the Space
        if: steps.cfg.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/space
        run: |
          git lfs install
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
