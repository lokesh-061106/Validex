# Development stack. Only the web UI (3000), API docs (8000) and Flower (5555) are published;
# Postgres, Redis, MinIO and the simulated authorities stay on the internal network.
x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql://aicte:aicte_secret@postgres:5432/aicte_validation
  REDIS_URL: redis://redis:6379/0
  USE_CELERY: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minio_admin
  MINIO_SECRET_KEY: minio_secret
  MINIO_BUCKET: aicte-documents
  AUTHORITY_API_URL: http://mock-authority:8100
  REQUIRE_MINIO: "true"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-validex-graph-dev}
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-0f3a9c}
  CORS_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: aicte_secret
      POSTGRES_DB: aicte_validation
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte -d aicte_validation"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret
    volumes: [minio_data:/data]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-validex-graph-dev}
    volumes: [neo4j_data:/data]

  mock-authority:
    build: {context: ./backend, dockerfile: Dockerfile.full}
    command: uvicorn app.mock_authority.main:app --host 0.0.0.0 --port 8100

  backend:
    build: {context: ./backend, dockerfile: Dockerfile.full}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [./backend:/app, models:/app/ml_models]
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
      mock-authority: {condition: service_started}
      neo4j: {condition: service_started}

  worker:
    build: {context: ./backend, dockerfile: Dockerfile.full}
    command: celery -A app.worker.celery worker -Q heavy,light,default --loglevel=info --concurrency=2
    volumes: [./backend:/app, models:/app/ml_models]
    environment: *backend-env
    depends_on: [backend]

  beat:
    build: {context: ./backend, dockerfile: Dockerfile.full}
    command: celery -A app.worker.celery beat --loglevel=info
    environment: *backend-env
    depends_on: [redis]

  flower:
    build: {context: ./backend, dockerfile: Dockerfile.full}
    command: celery -A app.worker.celery flower --port=5555
    ports: ["5555:5555"]
    environment: *backend-env
    depends_on: [worker]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      VALIDEX_API: http://backend:8000
    volumes: [./frontend/src:/app/src, ./frontend/public:/app/public]
    depends_on: [backend]

volumes:
  neo4j_data:
  postgres_data:
  minio_data:
  models:
